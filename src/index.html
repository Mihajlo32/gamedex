<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../img/Gemini_Generated_Image_mpoeaympoeaympoe.png"
    />

    <title>Gaming Platforma</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="controller.js"></script>
  </head>
  <body>
    <header>
      <h1>GameDex</h1>
      <button class="ham-mani hidden">
        <svg
          width="25px"
          height="25px"
          viewBox="0 0 48 48"
          xmlns="http://www.w3.org/2000/svg"
        >
          <title>menu-hamburger</title>
          <g id="Layer_2" data-name="Layer 2">
            <g id="invisible_box" data-name="invisible box">
              <rect width="24" height="24" fill="none" />
            </g>
            <g id="icons_Q2" data-name="icons Q2">
              <g>
                <path
                  d="M42,12a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2H6a2,2,0,0,1,2-2H40a2,2,0,0,1,2,2Z"
                />
                <path
                  d="M42,24a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2H6a2,2,0,0,1,2-2H40a2,2,0,0,1,2,2Z"
                />
                <path
                  d="M42,36a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2H6a2,2,0,0,1,2-2H40a2,2,0,0,1,2,2Z"
                />
              </g>
            </g>
          </g>
        </svg>
      </button>
      <form class="search-box">
        <input type="text" id="searchInput" placeholder="Pretraži igre..." />
        <button id="searchBtn">Traži</button>
        <ul class="search-suggestions hidden"></ul>
      </form>
    </header>

    <main>
      <div class="main">
        <div class="controls">
          <button class="sort--rating"></button>
          <button class="sort-btn" data-sort="name">Sortiraj A-Z ↓</button>
          <button class="open--geners">Geners</button>

          <div class="bockmark">
            <button class="btn--bookmark--show" id="bookmarkBtn">
              <svg
                class="w-6 h-6 text-gray-800 dark:text-white svg-btn"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m17 21-5-4-5 4V3.889a.92.92 0 0 1 .244-.629.808.808 0 0 1 .59-.26h8.333a.81.81 0 0 1 .589.26.92.92 0 0 1 .244.63V21Z"
                />
              </svg>
            </button>
          </div>
          <button class="close--ham--manu">X</button>
        </div>
      </div>
      <div id="game-container" class="game-grid">
        <p class="loading-msg"></p>
      </div>
      <div class="pagination-container">
        <!-- <button id="prevBtn" class="nav-btn">Prethodna</button>
        <span id="pageNumber">Strana 1</span>
        <button id="nextBtn" class="nav-btn">Sledeća</button> -->
      </div>
      <div class="details-container"></div>
      <div class="bookmark--container">
        <div class="bookmarks-overlay hidden">
          <div class="bookmarks-window">
            <button class="btn--close-bookmarks">&times;</button>
            <h2>Tvoji Bukmarkovi</h2>
            <div class="bookmarks__list"></div>
          </div>
        </div>
      </div>
      <div class="genres-box overlay hidden">
        <ul class="genres-list-container"></ul>
        <button class="btn--close--genres">X</button>
      </div>
    </main>
    <script src="../src/hambureger.js"></script>
  </body>
</html>
